# [SHIP-08] 이 리포에는 CI 가 없었다 — 「1526 tests green · tsc 0」이 **누군가 손으로 돌린
# 결과**였고, 그것이 사실인지는 커밋을 받은 사람이 알 수 없었다. 제품이 파는 것이 「강제된
# 규율」인데 정작 자기 규율은 자율에 맡겨져 있었다.
#
# 게이트는 README 가 광고하는 두 가지 그대로다: 타입 0 · 테스트 fail 0.
# 성능 문턱은 여기서 재지 않는다 — CI 러너는 조용하지 않고, 부하 창에서 잰 wall-clock 은
# 제품이 아니라 기계를 잰다([PERF-09]). 그 판정은 테스트 안에서 부하 창을 보고 스스로 미룬다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json 의 engines 와 같은 하한을 쓴다 — 여기 숫자를 따로 적으면 언젠가 갈린다.
          node-version-file: package.json
          cache: npm
      # `.npmrc` 가 설치자용으로 devDependencies 를 빼므로([SHIP-04]) CI 는 명시적으로 켠다.
      - run: npm ci --include=dev
      - run: npm run check          # tsc --noEmit
      - run: npm test               # vitest run
      # 커밋된 번들이 소스에서 재현되는지 — 리뷰가 실행 코드를 실제로 검증하려면 이것이 참이어야 한다.
      - run: npm run build && git diff --exit-code -- core/dist
