# p3vot command mapping (spec §9).
test: pnpm -r --workspace-concurrency=1 test
build: pnpm -r build
deploy: ''
e2e: pnpm --filter @p3vot/e2e e2e
dev-server: bash scripts/dev.sh
# The release gates live in profile.yaml (`release_gates`). The old single key `release-security-check`
# is still read as the `security` gate for profiles that have not moved yet.
